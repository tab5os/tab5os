name: ci

on:
  push:
  pull_request:

jobs:
  idf-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < firmware/idf_version.txt)" >> "$GITHUB_OUTPUT"

  firmware:
    needs: idf-version
    runs-on: ubuntu-latest
    container: espressif/idf:${{ needs.idf-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # third_party/micropython (not recursive)
      - name: Check IDF version matches idf_version.txt
        shell: bash
        run: |
          want="$(tr -d '[:space:]' < firmware/idf_version.txt)"
          have="$(cd "$IDF_PATH" && git describe --tags --exact-match 2>/dev/null || echo unknown)"
          echo "want $want, container has $have"
          [ "$want" = "$have" ]
      # Every step is a t5 command (tools/t5/t5), the same one a developer runs.
      - name: Build
        shell: bash
        run: . "$IDF_PATH/export.sh" && tools/t5/t5 build
      - name: Image size budget
        shell: bash
        run: tools/t5/t5 size-check
      - name: ABI struct layouts against the lock (docs/abi-stability.md)
        shell: bash
        run: . "$IDF_PATH/export.sh" && tools/t5/t5 abi-check
      - name: Build the SDK test apps against this firmware
        shell: bash
        run: . "$IDF_PATH/export.sh" && tools/t5/t5 apps
      - name: Build the example apps against this firmware
        shell: bash
        run: . "$IDF_PATH/export.sh" && tools/t5/t5 examples
      - name: Package the app SDK and build every example from the tarball alone
        shell: bash
        run: . "$IDF_PATH/export.sh" && tools/t5/t5 sdk
      - name: Build the recovery image (and check it fits its partition)
        shell: bash
        run: . "$IDF_PATH/export.sh" && tools/t5/t5 recovery-build
      - name: Build device test app
        shell: bash
        run: . "$IDF_PATH/export.sh" && tools/t5/t5 device-build
      - uses: actions/upload-artifact@v4
        with:
          name: tab5os
          path: |
            firmware/build/tab5os.bin
            firmware/build/tab5os.elf
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/flasher_args.json
            recovery/build/tab5recovery.bin
            test/apps/build/*.t5app

  analyze:
    # docs/coding-standard.md, rule 10: GCC's static analyzer on the strict
    # components (STRICT in firmware/CMakeLists.txt). Findings fail the build.
    needs: idf-version
    runs-on: ubuntu-latest
    container: espressif/idf:${{ needs.idf-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Firmware and recovery with -fanalyzer
        shell: bash
        run: . "$IDF_PATH/export.sh" && tools/t5/t5 analyze

  c6:
    needs: idf-version
    runs-on: ubuntu-latest
    container: espressif/idf:${{ needs.idf-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the C6 radio firmware (and check it fits c6fw)
        shell: bash
        run: . "$IDF_PATH/export.sh" && tools/t5/t5 c6-build
      - uses: actions/upload-artifact@v4
        with:
          name: tab5os-c6
          path: c6/build/tab5os_c6.bin

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ninja-build
      - run: tools/t5/t5 host-test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # fetch-depth 0 brings the release tags: the release rules compare against the last one.
      - name: UI density, coding standard, sim LVGL config, ABI symbols, API reference, release rules (tools/t5/t5 lint)
        run: tools/t5/t5 lint

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ninja-build libsdl2-dev
      - name: Build the simulator
        run: tools/t5/t5 sim-build
      - name: Screenshots (dark theme, both orientations)
        # Hashes were recorded on macOS/clang; if LVGL's software renderer
        # differs by a pixel on Linux/gcc, re-record them from this job's
        # artifacts with `t5sim --shots DIR --update sim/golden`. Until then
        # a mismatch here doesn't fail the job.
        continue-on-error: true
        run: tools/t5/t5 sim-shots shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-screenshots
          path: shots/*.png
